<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Publicá y reclamá objetos perdidos de FIUBA.">
  <meta property="og:title" content="fiubaLost">
  <meta property="og:description" content="Publicá y reclamá objetos perdidos de FIUBA.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#164194">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 9.5L12 4L21 9.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 9.5H19.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6.5 9.5V18.5M10.17 9.5V18.5M13.83 9.5V18.5M17.5 9.5V18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M3.5 18.5H20.5M2.5 21H21.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        <span id="brandName">fiubaLost</span>
      </a>

      <nav id="nav" class="nav-links" aria-label="Principal"></nav>

      <div id="navAction" class="nav-action"></div>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading-shell">
      <p class="muted">Cargando catálogo de FIUBA…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>fiubaLost</strong>
        <span>Facultad de Ingeniería · Universidad de Buenos Aires</span>
      </div>
      <div class="footer-links">
        <a href="#/">Listado</a>
        <a href="#/sedes">Sedes</a>
        <a href="#/new">Publicar objeto</a>
      </div>
    </div>
  </footer>

  <div class="chat-widget" id="chatWidget">
    <button class="chat-fab" id="chatToggle" type="button" aria-expanded="false" aria-controls="chatPanel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.54 0-2.99-.41-4.24-1.13L3 20.5l1.36-4.76A8.46 8.46 0 0 1 3.5 12 8.5 8.5 0 1 1 21 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Asistente FIUBA</span>
    </button>

    <section class="chat-panel" id="chatPanel" aria-label="Asistente de fiubaLost" hidden>
      <div class="chat-header">
        <div>
          <h2 class="chat-title">Asistente fiubaLost</h2>
          <p class="chat-sub">Ayuda para buscar, publicar y reclamar objetos</p>
        </div>
        <button class="chat-close" id="chatClose" type="button" aria-label="Cerrar asistente">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <div class="chat-suggestions" id="chatSuggestions">
        <button class="chat-suggest-btn" type="button" data-prompt="¿Qué objetos están publicados ahora?">Ver objetos recientes</button>
        <button class="chat-suggest-btn" type="button" data-prompt="¿Cómo publico un objeto que perdí?">Cómo publicar</button>
        <button class="chat-suggest-btn" type="button" data-prompt="¿Cómo reclamo un objeto encontrado?">Cómo reclamar</button>
      </div>

      <form class="chat-form" id="chatForm">
        <input id="chatInput" type="text" maxlength="500" autocomplete="off" placeholder="Preguntá por un objeto o cómo usar la app…" aria-label="Escribí tu consulta">
        <button class="btn compact" id="chatSend" type="submit">Enviar</button>
      </form>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
